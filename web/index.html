<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaperTrail · 论文证据链工作台</title>
<meta name="description" content="面向大学生的文献证据矩阵工具：把多篇论文摘要整理为可追溯的证据矩阵、观点关系与综述工作包。全部在浏览器本地处理，不上传材料。">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e7466'/%3E%3Cpath d='M9 8h10l4 4v12H9z' fill='%23faf6ee'/%3E%3Cpath d='M12 14h8M12 18h8M12 22h5' stroke='%230e7466' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>

<header class="topbar" id="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#" data-action="go" data-view="home" aria-label="PaperTrail 首页">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 3h9l5 5v13H5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 10h7M8.5 13.5h7M8.5 17h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="17.5" cy="17.5" r="3.4" fill="#c2703d" stroke="none"/></svg>
      </span>
      <span class="brand-text">PaperTrail<small>论文证据链工作台</small></span>
    </a>
    <nav class="tabs" id="tabs" aria-label="主导航">
      <button class="tab" data-action="go" data-view="home">首页</button>
      <button class="tab" data-action="go" data-view="import">导入材料</button>
      <button class="tab" data-action="go" data-view="matrix">文献矩阵<span class="tab-badge" id="badge-matrix" hidden>0</span></button>
      <button class="tab" data-action="go" data-view="relations">观点关系<span class="tab-badge" id="badge-relations" hidden>0</span></button>
      <button class="tab" data-action="go" data-view="workpack">综述工作包</button>
    </nav>
    <button class="btn btn-ghost btn-about" data-action="about">产品说明</button>
  </div>
</header>

<main id="view" class="view" tabindex="-1">
  <div class="boot-fallback" style="max-width:560px;margin:60px auto;text-align:center;color:#5b6b74;font-size:14px;line-height:1.7">
    <p style="font-size:16px;font-weight:600;color:#22303a">正在加载 PaperTrail 工作台…</p>
    <p>若长时间停留在此页面，请刷新重试；本工具为纯静态页面，所有材料仅在浏览器本地处理。</p>
  </div>
</main>
<noscript>
  <div style="max-width:560px;margin:40px auto;padding:20px;text-align:center;color:#b4432f;font-size:14px">
    PaperTrail 需要启用 JavaScript 才能运行。请在浏览器设置中开启 JavaScript 后刷新页面。
  </div>
</noscript>

<footer class="footer">
  <span>PaperTrail · 2026 Qoder 高校创造力大赛 · StudyHack 学习科研赛道</span>
  <span class="footer-privacy">所有材料仅在浏览器本地处理 · 规则引擎辅助整理，请根据原文核验</span>
</footer>

<!-- 文献详情抽屉 -->
<div class="drawer-scrim" id="drawer-scrim" data-action="close-drawer" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="文献详情" hidden></aside>

<!-- 产品说明弹窗 -->
<div class="modal-scrim" id="about-scrim" data-action="close-about" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="产品说明" id="about-modal"></div>
</div>

<!-- 工作包编辑弹窗 -->
<div class="modal-scrim" id="edit-scrim" data-action="close-edit-wp" hidden>
  <div class="modal modal-wide" role="dialog" aria-modal="true" aria-label="编辑综述工作包" id="edit-modal"></div>
</div>

<!-- 提示条 -->
<div class="toast-wrap" id="toast-wrap" aria-live="polite"></div>

<!-- A4 打印报告（仅打印时可见） -->
<div id="print-root" aria-hidden="true"></div>

<script src="js/data/samples.js"></script>
<script src="js/core/parser.js"></script>
<script src="js/core/engine.js"></script>
<script src="js/core/exporter.js"></script>
<script src="js/core/selftest.js"></script>
<script src="js/store.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
